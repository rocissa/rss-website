  sponsor1:
    - title: "Building Red Teaming into AI Operations: Development, Validation, and Beyond"
      presenter: Mark Ostrowski
      sponsor: Atlantic Data
      abstract: >
        Organizations treating red teaming as a one-time gate before launch are missing the real value. This session will discuss
        how ADS Harbour Services reframes red teaming as a continuous lifecycle practice that supports responsible AI at three 
        critical points: (1) Development — integrate adversarial testing into your build cycle to surface risks early as prompts, 
        guardrails, and model configurations change; (2) Validation — execute comprehensive red team campaigns against live 
        applications and agents before production release; (3) Ongoing Operations — schedule recurring red team assessments 
        following updates and capability changes to catch regression and drift. Learn why this three-phase approach uncovers 
        the four essential risk categories—application-specific vulnerabilities, safety and compliance gaps, security weaknesses, 
        and regression risks—and how to build red teaming into your governance model rather than treating it as testing overhead.
      bios:
        - name: Mark Ostrowski
          bio: >
            Mark Ostrowski has provided thought leadership for the IT security industry for over 25 years, outlining the threat 
            landscape and helping organizations understand how they can proactively mitigate and manage risk in our world of digital
            transformation and artificial intelligence. Mark is an active cybersecurity educator and media contributor, frequently
            helping translate complex security issues into practical guidance for organizations and households alike. Today Mark 
            is the CTO at Atlantic Data Security where he is helping clients usher in the latest era of cybersecurity where AI has
            become a force multiplier in threat prevention and business operations.
      url: /2026/day1/sponsor-1#sponsor1-s1
    - title: "AI and DLP: How Fortinet's Data Loss Prevention Solutions Can Secure Your Private Data from AI Leakage"
      presenter: Mark Rosenecker
      sponsor: Fortinet
      abstract: >
        In the present era of artificial intelligence, its adoption in office environments poses a significant risk of 
        sensitive data types (such as PII, PHI, IP, and more) being inappropriately shared through insecure applications. 
        Given the multitude of AI applications available, it is crucial for organizations to effectively monitor and safeguard 
        their sensitive data from unintentional (or even deliberate) misappropriation. Fortinet offers comprehensive solutions 
        to address these challenges. By leveraging our industry-leading FortiGate, cloud-based FortiSASE, and endpoint-based 
        FortiDLP, Fortinet enables organizations to observe, inspect, and control the flow of sensitive data regardless of the 
        location of their users.
      bios:
        - name: Mark Rosenecker
          bio: >
            With 31 years of experience in the IT industry, half of which dedicated to cybersecurity, Mark has a solid 
            understanding of the field. Throughout his career, he has held various positions at private colleges, service 
            providers, and large multinational corporations, and his current role as a Senior System Engineer at Fortinet began 
            7 years ago. Mark also has extensive hands-on experience with a diverse range of solutions, including Palo Alto 
            Networks, Cisco, Checkpoint, and SonicWall, and his decade of experience as a server and virtualization engineer 
            further enhances his skill set. This diverse experience has enabled Mark to develop his unique insights into the 
            industry and identify effective strategies for safeguarding his customers.
      url: /2026/day1/sponsor-1#sponsor1-s2
    - title: "Security Strategy for the Agentic Enterprise"
      presenter: Silas Glines
      sponsor: Cyberhaven
      abstract: >
        Every company is becoming an agentic enterprise, where humans and autonomous AI agents work side by side. The 
        competitive edge is no longer any single system. It is the workflows: how human and machine intelligence combine with 
        proprietary data to get work done.

        Most security leaders are now expected to approve AI adoption, not block it. Yet the tools in place were designed to 
        inspect content at fixed checkpoints, not to follow data through AI tools and agents. The result is AI usage spreading 
        faster than security teams can see or govern, which is how shadow AI takes hold.

        This session treats data security as part of AI transformation planning rather than a separate tooling decision: one 
        understanding of enterprise data, protection that stays with data through workflows, and action before data leaves 
        the organization's control.
      bios:
        - name: Silas Glines
          bio: >
            Silas Glines is the Director of Solutions Engineering at Cyberhaven and a founding member of the company’s 
            go-to-market team. Based in Boston, he brings over a decade of experience in cybersecurity, with a focus on data 
            protection, and previously hosted the Data Security Innovators podcast.
      url: '/2026/day1/sponsor-1#sponsor1-s3'

  sponsor2:
    - title: "Examining Real-World Use Cases of the Emerging Threats in the AI Layer of IT Along with Mitigating Techniques"
      presenter: Dan Brady
      sponsor: Trend AI
      abstract: >
        The rapid adoption of generative AI has introduced a new layer of complexity to the cybersecurity landscape. With AI 
        tools now widely accessible across organizations, employees and attackers alike are finding new ways to leverage these 
        technologies—creating vulnerabilities and attack vectors that defenders must understand.

        In this session, we’ll examine real-world use cases of emerging threats within the AI layer of IT, including how 
        generative AI is changing the vulnerability ecosystem and creating new challenges for security teams. We’ll explore 
        what these evolving risks look like in practice, how they can impact organizations, and the practical techniques 
        defenders can use to identify, manage, and mitigate them.

        Attendees will walk away with a better understanding of the emerging AI threat landscape and actionable approaches 
        for adapting their vulnerability management and security strategies for an AI-driven environment.
      bios:
        - name: Dan Brady
          bio: >
            Dan Brady is a Senior Solutions Engineer with 8 years of experience helping organizations assess, strengthen, and improve their cybersecurity posture. He works closely with security teams to understand evolving threats, identify areas of risk, and develop practical strategies for improving their security resilience. His experience spans emerging technologies and the evolving challenges organizations face as the threat landscape continues to change.
      url: '/2026/day2/sponsor-2#sponsor2-s1'

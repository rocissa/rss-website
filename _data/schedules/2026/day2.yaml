  sponsor1:
    - title: "AI beyond the hype: Strategies for real operational impact"
      presenter: Edgar Ortiz
      sponsor: Tines
      abstract: >
        Organizations are investing heavily in AI, yet many security teams struggle to move beyond pilots and into real 
        operational impact. What separates those who scale from those who stall? In this session, we will share AI adoption 
        strategies, common pitfalls to avoid, and how to make AI a force multiplier within your automation strategy.
      bios:
        - name: Edgar Ortiz
          bio: >
            Edgar Ortiz currently serves as a Principal Solutions Engineer at Tines, where he works with enterprises to 
            transform how teams leverage automation, orchestration, and AI. Prior to Tines, Edgar held technical and 
            leadership roles at Noname Security/Akamai, MuleSoft/Salesforce, and Cisco. As the first Sales Engineer at Noname 
            Security, he helped build and scale the company's presales organization from its earliest stages through its 
            acquisition by Akamai Technologies.

            A software engineer by training, Edgar brings a practitioner's perspective to emerging technology, combining 
            hands-on technical depth with years of experience advising enterprise architects, security leaders, and 
            executives. He is particularly interested in the convergence of APIs, cybersecurity, automation, and AI, and how 
            these technologies are reshaping the way organizations build, secure, and operate modern systems.
